<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ApexKube logo">
  <title>ApexKube</title>
  <defs>
    <linearGradient id="ak-apex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cffafe"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="ak-apex-shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5c6"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="ak-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="ak-right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#3b2a8f"/>
    </linearGradient>
  </defs>
  <!-- Cube body -->
  <polygon points="10,26 32,38 32,62 10,50" fill="url(#ak-left)"/>
  <polygon points="32,38 54,26 54,50 32,62" fill="url(#ak-right)"/>
  <!-- Apex: the cube's top rises to a peak -->
  <polygon points="32,2 10,26 32,38" fill="url(#ak-apex)"/>
  <polygon points="32,2 32,38 54,26" fill="url(#ak-apex-shade)"/>
  <!-- Circuit traces: the "agent" wiring -->
  <g fill="none" stroke="#cffafe" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <path d="M15.5 34v9l8.5 4.6"/>
    <path d="M38.5 45.5l8-4.4v-6.6"/>
  </g>
  <g fill="#cffafe">
    <circle cx="15.5" cy="33.2" r="1.8"/>
    <circle cx="24.6" cy="48" r="1.8"/>
    <circle cx="38" cy="45.8" r="1.8"/>
    <circle cx="46.5" cy="33.8" r="1.8"/>
  </g>
</svg>
